name: Verify Veriq
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse tracked secret files
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\..+|credentials\.json|\.pem$|\.key$' | grep -v -E '(^|/)\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "Tracked secret files:"
            echo "$tracked"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
