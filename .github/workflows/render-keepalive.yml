name: Render scanner keep-alive

on:
  schedule:
    # Five-minute intervals, offset from the busy start of the hour (UTC).
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

# No checkout, repository writes, API keys or wallet credentials are needed.
permissions: {}
concurrency:
  group: render-scanner-keepalive
  cancel-in-progress: false

jobs:
  ping:
    if: github.repository == 'nonsense3/Veriq' && vars.RENDER_KEEPALIVE_DISABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Optional repository variable. Default hits Render directly, not Cloudflare.
      HEALTH_URL: ${{ vars.RENDER_HEALTH_URL || 'https://veriq-avbs.onrender.com/health' }}
    steps:
      - name: Wake scanner and validate liveness
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            --proto '=https' \
            --connect-timeout 10 --max-time 90 \
            --retry 2 --retry-all-errors --retry-delay 5 --retry-max-time 220 \
            --header 'Cache-Control: no-cache' \
            --output health.json "$HEALTH_URL"
          python3 - <<'PY'
          import json
          with open('health.json', encoding='utf-8') as response:
              health = json.load(response)
          if health.get('status') != 'ok' or health.get('service') != 'veriq-scanner':
              raise SystemExit('Scanner did not return a healthy liveness response')
          print('Veriq scanner responded successfully at', health.get('timestamp', 'unknown time'))
          PY
